<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swastik Blood Donation Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        
        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            background-color: rgb(250, 100, 0);
            color: #ffffff;
            padding: 12px;
            text-align: center;
            border-radius: 4px;
            font-size: 24px;
            margin-top: 0;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-style: italic;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        
        .radio-group,
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .radio-group label,
        .checkbox-group label {
            margin-bottom: 0;
            font-weight: normal;
        }
        
        .terms-text {
            font-size: 14px;
            color: #333333;
            background: #f9f9f9;
            padding: 10px;
            border-left: 4px solid rgb(250, 100, 0);
            margin-bottom: 15px;
        }
        
        input[type="submit"] {
            background-color: rgb(250, 100, 0);
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        
        input[type="submit"]:hover {
            background-color: rgb(220, 85, 0);
        }
    </style>
</head>

<body>

    <div class="form-container">
        <form action="#" method="POST">

            <h1>Swastik Blood Donation Portal</h1>

            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="address">Address:</label>
                <input type="text" id="address" name="address" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" required>
            </div>

            <div class="form-group">
                <label for="aadhaar">Aadhaar Card Number:</label>
                <input type="text" id="aadhaar" name="aadhaar" pattern="[0-9]{12}" placeholder="12-digit Aadhaar number" required>
            </div>

            <div class="form-group">
                <label for="bdate">Date of Birth:</label>
                <input type="date" id="bdate" name="bdate" required>
            </div>

            <div class="form-group">
                <label>Gender:</label>
                <div class="radio-group">
                    <input type="radio" id="male" name="gender" value="male" required>
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>

                    <input type="radio" id="other" name="gender" value="other">
                    <label for="other">Other</label>
                </div>
            </div>

            <div class="form-group">
                <label for="blood-group">Blood Group:</label>
                <select id="blood-group" name="blood_group" required>
                    <option value="" disabled selected>Select Blood Group</option>
                    <option value="A+">A positive (A+)</option>
                    <option value="A-">A negative (A-)</option>
                    <option value="B+">B positive (B+)</option>
                    <option value="B-">B negative (B-)</option>
                    <option value="AB+">AB positive (AB+)</option>
                    <option value="AB-">AB negative (AB-)</option>
                    <option value="O+">O positive (O+)</option>
                    <option value="O-">O negative (O-)</option>
                </select>
            </div>

            <div class="terms-text">
                These Terms and Conditions ("Terms") govern your use of the "Swastik Blood Donation Portal" website and services. By accessing or using our website, services, or blood donation programs, you agree to be bound by these Terms.
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I agree to the terms and conditions</label>
            </div>

            <div class="form-group">
                <input type="submit" value="Submit Registration">
            </div>

        </form>
    </div>

</body>

</html>
