<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Paragraph Color Example</title>
    <style>
        /* Change all paragraphs */
        /* p { color: green; } */
        /* Change only paragraphs with this class */
        
        .my-paragraph {
            color: purple;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <h2>Example</h2>

    <p class="my-paragraph">this is paragraph (purple text)</p>

    <p style="color: blue;">this is paragraph (inline style blue)</p>
</body>

</html>
